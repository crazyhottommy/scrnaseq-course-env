name: build course image
on:
  push: { branches: [main], paths: ['.devcontainer/**', '.github/workflows/build-image.yml'] }
  workflow_dispatch: {}
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup && df -h / | tail -1
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with: { context: .devcontainer, push: true, tags: "ghcr.io/crazyhottommy/scrnaseq-course-env:latest" }
      - name: Smoke test
        run: docker run --rm ghcr.io/crazyhottommy/scrnaseq-course-env:latest Rscript -e 'suppressPackageStartupMessages({library(Seurat); library(SingleR); library(clusterProfiler); library(presto)}); cat("R", R.version.string, "| Seurat", as.character(packageVersion("Seurat")), "| rstudio-server:", nzchar(Sys.which("rstudio-server")), "\n")'
      - name: RStudio serves without a login (as the devcontainer will run it)
        run: |
          docker run -d --name rs -p 8787:8787 -u rstudio -e DISABLE_AUTH=true ghcr.io/crazyhottommy/scrnaseq-course-env:latest bash -c 'sudo rstudio-server start && sleep 600'
          for i in $(seq 1 30); do code=$(curl -s -o /tmp/rs.html -w '%{http_code}' http://localhost:8787/ || true); [ "$code" = "200" ] && break; sleep 2; done
          echo "HTTP $code"; grep -qi 'rstudio' /tmp/rs.html && ! grep -qi 'sign in' /tmp/rs.html && echo "RStudio page served, no login form" || { echo "RStudio check failed"; docker logs rs | tail -20; exit 1; }
          docker exec -u rstudio rs bash -c 'sudo -n true && echo "rstudio user can sudo"' && docker exec rs Rscript -e 'cat("here:", requireNamespace("here", quietly=TRUE), "jsonlite:", requireNamespace("jsonlite", quietly=TRUE), "\n")'
          docker rm -f rs >/dev/null
