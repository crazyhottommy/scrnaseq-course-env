name: diagnose rstudio
on: { workflow_dispatch: {} }
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the devcontainer launch with a cookie jar (auth-none signs in via cookie)
        run: |
          IMG=ghcr.io/crazyhottommy/scrnaseq-course-env:latest; docker pull -q $IMG >/dev/null
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36'
          docker run -d --name rs -p 8787:8787 -e DISABLE_AUTH=true -e USER=rstudio $IMG >/dev/null; sleep 10
          rm -f /tmp/jar; for i in $(seq 1 20); do code=$(curl -sL --max-redirs 8 -c /tmp/jar -b /tmp/jar -A "$UA" -o /tmp/p.html -w '%{http_code}' http://localhost:8787/ || true); [ "$code" = "200" ] && break; sleep 2; done
          echo "RESULT: HTTP $code; sign-in page: $(grep -qi 'sign in' /tmp/p.html && echo yes || echo no); rstudio page: $(grep -qi 'rstudio' /tmp/p.html && echo yes || echo no); cookies: $(grep -c . /tmp/jar || true)"
          echo "redirect chain:"; curl -sIL --max-redirs 4 -c /tmp/jar2 -b /tmp/jar2 -A "$UA" http://localhost:8787/ | grep -E '^HTTP|^Location' | tr -d '\r' | sed 's/^/   /'
          docker exec -u rstudio rs bash -c 'sudo -n true && echo "rstudio user can sudo"'
          docker rm -f rs >/dev/null
